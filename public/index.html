<!DOCTYPE html>
<!DOCTYPE html>
<html lang="ru">
<head>
<!-- Подключение манифеста -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#007bff">

<!-- Регистрация Service Worker -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('SW registered!', reg))
        .catch(err => console.log('SW registration failed:', err));
    });
  }
</script>

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#00a884">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dani — Мессенджер</title>
    <style>
        :root {
            --primary-green: #2e7d32;
            --light-green: #e8f5e9;
            --accent-green: #4caf50;
            --dark-green: #1b5e20;
            --bg-color: #f1f8e9;
            --white: #ffffff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 750px;
            background: var(--white);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(46, 125, 50, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .screen {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .hidden {
            display: none !important;
        }
        #auth-screen {
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
        }
        #auth-screen h1 {
            color: var(--primary-green);
            margin-bottom: 8px;
        }
        #auth-screen p {
            color: #666;
            margin-bottom: 24px;
            font-size: 14px;
        }
        .auth-input, .chat-input-text {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #c8e6c9;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
        }
        .btn {
            background-color: var(--accent-green);
            color: var(--white);
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
        }
        .error-msg {
            color: #d32f2f;
            font-size: 14px;
            margin-top: 10px;
        }
        .chat-header {
            background-color: var(--primary-green);
            color: var(--white);
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .chat-header h2 { margin: 0; font-size: 20px; }
        #chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: #fafafa;
        }
        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 12px;
            word-break: break-word;
            font-size: 15px;
        }
        .message.incoming {
            background-color: var(--light-green);
            color: var(--dark-green);
            align-self: flex-start;
        }
        .message.outgoing {
            background-color: var(--accent-green);
            color: var(--white);
            align-self: flex-end;
        }
        .message .author {
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 4px;
            opacity: 0.8;
        }
        .message img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 4px;
            cursor: pointer;
        }
        .chat-input-area {
            padding: 12px 16px;
            background: var(--white);
            border-top: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;}
        .file-upload-btn {
            background: #e8f5e9;
            color: var(--primary-green);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
        }
        .send-btn {
            background-color: var(--primary-green);
            color: var(--white);
            border: none;
            padding: 0 16px;
            height: 44px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        #file-input { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Экран входа -->
        <div id="auth-screen" class="screen">
            <h1>🌿 Dani Messenger</h1>
            <p>Введите код доступа из белого списка и ваше имя</p>
            <input type="text" id="username-input" class="auth-input" placeholder="Ваше имя" style="margin-bottom: 12px;" />
            <input type="password" id="code-input" class="auth-input" placeholder="Код белого списка (DANI2026)" />
            <button class="btn" onclick="tryLogin()">Войти в чат</button>
            <div id="auth-error" class="error-msg"></div>
        </div>

        <!-- Экран чата -->
        <div id="chat-screen" class="screen hidden">
            <div class="chat-header">
                <h2>🌿 Dani</h2>
                <span id="online-users-list" style="font-size: 13px;">Онлайн: 0</span>
            </div>
            <div id="typing-indicator" style="font-size: 12px; font-style: italic; color: #558b2f; padding: 4px 16px 0; min-height: 16px;"></div>
            <div id="chat-messages"></div>
            <div class="chat-input-area">
                <input type="file" id="file-input" accept="image/*" onchange="sendImage(event)">
                <button class="file-upload-btn" onclick="document.getElementById('file-input').click()">📷</button>
                <input type="text" id="message-input" class="chat-input-text" placeholder="Сообщение..." onkeypress="if(event.key==='Enter')sendMessage()">
                <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myUsername = '';

        function tryLogin() {
            const username = document.getElementById('username-input').value.trim();
            const code = document.getElementById('code-input').value.trim();
            const errorDiv = document.getElementById('auth-error');

            if (!username) {
                errorDiv.innerText = 'Введите ваше имя!';
                return;
            }
            myUsername = username;
            socket.emit('auth_check', { code, username });
        }

        socket.on('auth_result', (data) => {
            if (data.success) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('chat-screen').classList.remove('hidden');
            } else {
                document.getElementById('auth-error').innerText = data.message || 'Неверный код белого списка!';
            }
        });

        // Список тех, кто сейчас онлайн
        socket.on('update_online_users', (users) => {
            const onlineSpan = document.getElementById('online-users-list');
            if (onlineSpan) {
                onlineSpan.textContent = `Онлайн (${users.length}): ` + users.join(', ');
            }
        });

        // Индикатор "печатает..."
        const messageInput = document.getElementById('message-input');
        let typingTimeout;

        messageInput.addEventListener('input', () => {
            socket.emit('typing', myUsername);

            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                socket.emit('stop_typing');
            }, 1000);
        });

        socket.on('display_typing', (username) => {
            const indicator = document.getElementById('typing-indicator');
            if (indicator) {
                indicator.textContent = `${username} печатает...`;
            }
        });

        socket.on('hide_typing', () => {
            const indicator = document.getElementById('typing-indicator');
            if (indicator) {
                indicator.textContent = '';
            }
        });

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (text) {
                socket.emit('chat_message', { user: myUsername, text: text });
                input.value = '';
            }
        }

        function sendImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                socket.emit('chat_image', { user: myUsername, image: e.target.result });
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        socket.on('chat_message', (data) => {
            appendMessage(data.user, data.text, 'text');
        });

        socket.on('chat_image', (data) => {
            appendMessage(data.user, data.image, 'image');
        });

        function appendMessage(user, content, type) {
            const chatMessages = document.getElementById('chat-messages');
            const messageDiv = document.createElement('div');
            const isOutgoing = (user === myUsername);
            messageDiv.className = `message ${isOutgoing ? 'outgoing' : 'incoming'}`;

            let htmlContent = '<div class="author">' + escapeHtml(user) + '</div>';
            if (type === 'text') {
                htmlContent += '<div>' + escapeHtml(content) + '</div>';
            } else if (type === 'image') {
                htmlContent += '<img src="' + content + '" onclick="window.open(this.src)">';
            }

            messageDiv.innerHTML = htmlContent;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "'");
        }
    </script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then((reg) => console.log('Service Worker зарегистрирован!', reg.scope))
        .catch((err) => console.log('Ошибка регистрации Service Worker:', err));
    });
  }
</script>
</body>
</html>
