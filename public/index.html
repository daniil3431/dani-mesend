<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dani — Мессенджер</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2e7d32">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <style>
        :root {
            --primary-green: #2e7d32;
            --light-green: #e8f5e9;
            --accent-green: #4caf50;
            --dark-green: #1b5e20;
            --bg-color: #f1f8e9;
            --white: #ffffff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 750px;
            background: var(--white);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(46, 125, 50, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .screen {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .hidden {
            display: none !important;
        }
        #auth-screen {
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
        }
        #auth-screen h1 {
            color: var(--primary-green);
            margin-bottom: 8px;
        }
        #auth-screen p {
            color: #666;
            margin-bottom: 24px;
            font-size: 14px;
        }
        .auth-input, .chat-input-text {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #c8e6c9;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
        }
        .btn {
            background-color: var(--accent-green);
            color: var(--white);
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
        }
        .error-msg {
            color: #d32f2f;
            font-size: 14px;
            margin-top: 10px;
        }
        .chat-header {
            background-color: var(--primary-green);
            color: var(--white);
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .chat-header h2 { margin: 0; font-size: 20px; }
        #chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: #fafafa;
        }
        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 12px;
            word-break: break-word;
            font-size: 15px;
        }
        .message.incoming {
            background-color: var(--light-green);
            color: var(--dark-green);
            align-self: flex-start;
        }
        .message.outgoing {
            background-color: var(--accent-green);
            color: var(--white);
            align-self: flex-end;
        }
        .message .author {
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 4px;
            opacity: 0.8;
        }
        .message img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 4px;
            cursor: pointer;
        }
        .message {
            cursor: pointer;
            position: relative;
        }
        .message-reply-quote {
            border-left: 3px solid rgba(0,0,0,0.25);
            padding: 4px 8px;
            margin-bottom: 6px;
            font-size: 12px;
            opacity: 0.85;
            border-radius: 4px;
            background: rgba(0,0,0,0.06);
        }
        .message.outgoing .message-reply-quote {
            border-left-color: rgba(255,255,255,0.6);
            background: rgba(255,255,255,0.15);
        }
        .message-reply-quote .reply-author {
            font-weight: bold;
            display: block;
        }
        .read-status {
            display: inline-block;
            margin-left: 6px;
            font-size: 12px;
            opacity: 0.85;
        }
        .read-status.read {
            color: #b3e5fc;
        }
        #reply-preview {
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            background: #e8f5e9;
            border-top: 1px solid #c8e6c9;
            font-size: 13px;
        }
        #reply-preview.active { display: flex; }
        #reply-preview .reply-preview-text {
            color: var(--dark-green);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #reply-preview .reply-preview-text b { display: block; }
        #reply-preview .cancel-reply-btn {
            background: none;
            border: none;
            font-size: 18px;
            color: #666;
            cursor: pointer;
            padding: 0 0 0 12px;
        }
        .chat-input-area {
            padding: 12px 16px;
            background: var(--white);
            border-top: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;}
        .file-upload-btn {
            background: #e8f5e9;
            color: var(--primary-green);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
        }
        .send-btn {
            background-color: var(--primary-green);
            color: var(--white);
            border: none;
            padding: 0 16px;
            height: 44px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        #file-input { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Экран входа / регистрации -->
        <div id="auth-screen" class="screen">
            <h1>🌿 Dani Messenger</h1>
            <p id="auth-subtitle">Войдите в свой аккаунт</p>

            <input type="text" id="username-input" class="auth-input" placeholder="Имя пользователя" style="margin-bottom: 12px;" autocomplete="username" />
            <input type="password" id="password-input" class="auth-input" placeholder="Пароль" style="margin-bottom: 12px;" autocomplete="current-password" />
            <input type="password" id="code-input" class="auth-input hidden" placeholder="Код белого списка" style="margin-bottom: 12px;" />

            <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:#666; width:100%; margin-bottom:4px;">
                <input type="checkbox" id="remember-me" checked style="width:auto;"> Запомнить меня
            </label>

            <button class="btn" id="auth-submit-btn" onclick="tryLogin()">Войти</button>
            <div id="auth-error" class="error-msg"></div>

            <p style="margin-top:16px; font-size:13px;">
                <span id="auth-toggle-text">Нет аккаунта?</span>
                <a href="#" id="auth-toggle-link" onclick="toggleAuthMode(); return false;" style="color:var(--primary-green); font-weight:bold;">Зарегистрироваться</a>
            </p>
        </div>

        <!-- Экран чата -->
        <div id="chat-screen" class="screen hidden">
            <div class="chat-header">
                <h2>🌿 Dani</h2>
                <span id="online-users-list" style="font-size: 13px;">Онлайн: 0</span>
                <button onclick="logout()" style="background:none; border:1px solid rgba(255,255,255,0.5); color:#fff; border-radius:6px; padding:4px 10px; font-size:12px; cursor:pointer;">Выйти</button>
            </div>
            <div id="typing-indicator" style="font-size: 12px; font-style: italic; color: #558b2f; padding: 4px 16px 0; min-height: 16px;"></div>
            <div id="chat-messages"></div>
            <div id="reply-preview">
                <div class="reply-preview-text">
                    <b id="reply-preview-author"></b>
                    <span id="reply-preview-text"></span>
                </div>
                <button class="cancel-reply-btn" onclick="cancelReply()">✕</button>
            </div>
            <div class="chat-input-area">
                <input type="file" id="file-input" accept="image/*" onchange="sendImage(event)">
                <button class="file-upload-btn" onclick="document.getElementById('file-input').click()">📷</button>
                <input type="text" id="message-input" class="chat-input-text" placeholder="Сообщение..." onkeypress="if(event.key==='Enter')sendMessage()">
                <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myUsername = '';
        let replyingTo = null; // { id, user, preview }
        const sentMessages = {}; // id -> { element, readers: Set }
        let isRegisterMode = false;

        // ---------- Вход / Регистрация ----------
        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('code-input').classList.toggle('hidden', !isRegisterMode);
            document.getElementById('auth-subtitle').textContent = isRegisterMode
                ? 'Придумайте имя, пароль и введите код доступа'
                : 'Войдите в свой аккаунт';
            document.getElementById('auth-submit-btn').textContent = isRegisterMode ? 'Зарегистрироваться' : 'Войти';
            document.getElementById('auth-toggle-text').textContent = isRegisterMode ? 'Уже есть аккаунт?' : 'Нет аккаунта?';
            document.getElementById('auth-toggle-link').textContent = isRegisterMode ? 'Войти' : 'Зарегистрироваться';
            document.getElementById('auth-error').innerText = '';
        }

        function tryLogin() {
            const username = document.getElementById('username-input').value.trim();
            const password = document.getElementById('password-input').value;
            const code = document.getElementById('code-input').value.trim();
            const errorDiv = document.getElementById('auth-error');

            if (!username || !password) {
                errorDiv.innerText = 'Заполните имя и пароль!';
                return;
            }
            myUsername = username;
            if (isRegisterMode) {
                socket.emit('register', { code, username, password });
            } else {
                socket.emit('login', { username, password });
            }
        }

        // Автовход по сохранённому токену
        const savedToken = localStorage.getItem('dani_token');
        const savedUsername = localStorage.getItem('dani_username');
        if (savedToken && savedUsername) {
            myUsername = savedUsername;
            socket.emit('auto_login', { token: savedToken });
        }

        socket.on('auth_result', (data) => {
            if (data.success) {
                myUsername = data.username;
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('chat-screen').classList.remove('hidden');

                const rememberMe = document.getElementById('remember-me').checked;
                if (rememberMe && data.token) {
                    localStorage.setItem('dani_token', data.token);
                    localStorage.setItem('dani_username', data.username);
                } else {
                    localStorage.removeItem('dani_token');
                    localStorage.removeItem('dani_username');
                }

                setupNotifications();
            } else {
                localStorage.removeItem('dani_token');
                localStorage.removeItem('dani_username');
                document.getElementById('auth-error').innerText = data.message || 'Ошибка входа';
            }
        });

        // История чата приходит один раз сразу после входа
        socket.on('chat_history', (history) => {
            document.getElementById('chat-messages').innerHTML = '';
            history.forEach((m) => {
                if (m.text !== undefined) appendMessage(m.user, m.text, 'text', m.id, m.replyTo);
                else if (m.image !== undefined) appendMessage(m.user, m.image, 'image', m.id, m.replyTo);
            });
        });

        // Список тех, кто сейчас онлайн
        socket.on('update_online_users', (users) => {
            const onlineSpan = document.getElementById('online-users-list');
            if (onlineSpan) {
                onlineSpan.textContent = `Онлайн (${users.length}): ` + users.join(', ');
            }
        });

        // Индикатор "печатает..."
        const messageInput = document.getElementById('message-input');
        let typingTimeout;

        messageInput.addEventListener('input', () => {
            socket.emit('typing', myUsername);

            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                socket.emit('stop_typing');
            }, 1000);
        });

        socket.on('display_typing', (username) => {
            const indicator = document.getElementById('typing-indicator');
            if (indicator) {
                indicator.textContent = `${username} печатает...`;
            }
        });

        socket.on('hide_typing', () => {
            const indicator = document.getElementById('typing-indicator');
            if (indicator) {
                indicator.textContent = '';
            }
        });

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (text) {
                const payload = { user: myUsername, text: text };
                if (replyingTo) payload.replyTo = replyingTo;
                socket.emit('chat_message', payload);
                input.value = '';
                cancelReply();
            }
        }

        function sendImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const payload = { user: myUsername, image: e.target.result };
                if (replyingTo) payload.replyTo = replyingTo;
                socket.emit('chat_image', payload);
                cancelReply();
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        // --- Реплай (ответ на сообщение) ---
        function startReply(id, user, preview) {
            replyingTo = { id, user, preview };
            document.getElementById('reply-preview-author').textContent = user;
            document.getElementById('reply-preview-text').textContent = preview;
            document.getElementById('reply-preview').classList.add('active');
            document.getElementById('message-input').focus();
        }

        function cancelReply() {
            replyingTo = null;
            document.getElementById('reply-preview').classList.remove('active');
        }

        // --- Статус прочтения + уведомления ---
        socket.on('chat_message', (data) => {
            appendMessage(data.user, data.text, 'text', data.id, data.replyTo);
            notifyIfNeeded(data.user, data.text);
        });

        socket.on('chat_image', (data) => {
            appendMessage(data.user, data.image, 'image', data.id, data.replyTo);
            notifyIfNeeded(data.user, '📷 Фото');
        });

        // Локальное уведомление, если вкладка/приложение открыто, но не в фокусе.
        // Для полностью закрытого приложения уведомления приходят через Web Push (см. sw.js).
        function notifyIfNeeded(user, text) {
            if (user === myUsername) return;
            if (!('Notification' in window) || Notification.permission !== 'granted') return;
            if (!document.hidden) return;
            try {
                new Notification(user, { body: text, icon: '/icon-192.png' });
            } catch (e) { /* игнорируем, если не поддерживается */ }
        }

        function logout() {
            localStorage.removeItem('dani_token');
            localStorage.removeItem('dani_username');
            location.reload();
        }

        // ---------- Уведомления (Notification API + Web Push) ----------
        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
            return outputArray;
        }

        async function setupNotifications() {
            if (!('Notification' in window)) return;
            let permission = Notification.permission;
            if (permission === 'default') {
                permission = await Notification.requestPermission();
            }
            if (permission !== 'granted') return;
            if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;

            try {
                const reg = await navigator.serviceWorker.ready;
                const res = await fetch('/api/vapid-public-key');
                const { key } = await res.json();
                if (!key) return; // Сервер ещё не настроил VAPID-ключи

                let subscription = await reg.pushManager.getSubscription();
                if (!subscription) {
                    subscription = await reg.pushManager.subscribe({
                        userVisibleOnly: true,
                        applicationServerKey: urlBase64ToUint8Array(key)
                    });
                }
                await fetch('/api/subscribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: myUsername, subscription })
                });
            } catch (e) {
                console.log('Push-подписка недоступна:', e);
            }
        }

        socket.on('message_read_update', ({ id, reader }) => {
            const entry = sentMessages[id];
            if (!entry || reader === myUsername) return;
            entry.readers.add(reader);
            const statusSpan = entry.element.querySelector('.read-status');
            if (statusSpan) {
                statusSpan.textContent = '✓✓';
                statusSpan.classList.add('read');
                statusSpan.title = 'Прочитано: ' + Array.from(entry.readers).join(', ');
            }
        });

        function appendMessage(user, content, type, id, replyTo) {
            const chatMessages = document.getElementById('chat-messages');
            const messageDiv = document.createElement('div');
            const isOutgoing = (user === myUsername);
            messageDiv.className = `message ${isOutgoing ? 'outgoing' : 'incoming'}`;
            if (id) messageDiv.dataset.id = id;

            let htmlContent = '<div class="author">' + escapeHtml(user) + '</div>';

            if (replyTo) {
                htmlContent += '<div class="message-reply-quote">'
                    + '<span class="reply-author">' + escapeHtml(replyTo.user) + '</span>'
                    + escapeHtml(replyTo.preview)
                    + '</div>';
            }

            if (type === 'text') {
                htmlContent += '<div>' + escapeHtml(content) + '</div>';
            } else if (type === 'image') {
                htmlContent += '<img src="' + content + '" onclick="event.stopPropagation(); window.open(this.src)">';
            }

            if (isOutgoing && id) {
                htmlContent += '<span class="read-status">✓</span>';
            }

            messageDiv.innerHTML = htmlContent;

            // Клик по сообщению -> ответить на него
            messageDiv.addEventListener('click', () => {
                if (!id) return;
                const preview = type === 'image' ? '📷 Фото' : content;
                startReply(id, user, preview);
            });

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            if (isOutgoing && id) {
                sentMessages[id] = { element: messageDiv, readers: new Set() };
            } else if (id) {
                // Сообщение от другого пользователя — отмечаем как прочитанное
                socket.emit('message_read', { id, reader: myUsername });
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "'");
        }
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((reg) => console.log('Service Worker зарегистрирован!', reg.scope))
                    .catch((err) => console.log('Ошибка регистрации Service Worker:', err));
            });
        }
    </script>
</body>
</html>
